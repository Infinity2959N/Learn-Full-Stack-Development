<!--Q6, 7. Form-->
<strong><center>Learn form very properly with all the main functions</center></strong> 
<form action="/submit-path" method="POST">
	<fieldset>
		<legend> Basic Information</legend>
		<label for="name">Full Name</label>
		<input type="text" id="name" name="fullname"><br><br>
		<label for="dob">Enter Birth Date</label>
		<input type="date" id="dob" name="birthdate"><br><br>
		<label for="gender">Select Gender</label>
		<input type="radio" id="male" name="gender" value="male"><label for="male">Male</label>
		<input type="radio" id="female" name="gender" value="female"><label for="female">Female</label><br><br>
<!-- Check out input for address and phone, as well as id and name for radio.  "Label" is always paired with "id"-->
<!-- id is for client side identification, used by css and js (eg. document.getElementById), name is server side. Does not have to be unique, but required for radio groups. This is the key sent to server-->
		<label for="address">Enter Address</label>
		<textarea id="address" name="address"></textarea><br><br>
`		<label for="city">City: </label>
		<input list="cities" id="city" name="customer_city">
		<datalist id="cities">
			<option value="Delhi">
			<option value="Pune">
			<option value="Bangalore">
		</datalist><br><br>
		<label for="car">Select car type</label>
		<select id="car" name="car">
			<option value="sedan">Sedan</option>
			<option value="hatchback">Hatchback</option>
			<option value="suv">SUV</option>
		</select><br><br>
<!--datalist vs select: select is a closed list, user must chose a given option. Datalist is an "autocomplete" feature. user sees suggestions but can still type entirely different-->
		<label for="phone">Phone Number</label>
		<input type="tel" id="phone" name="phone">
	</fieldset>
	<fieldset>
		<legend>Extra Information</legend>
		<label for="interest">Interests</label>
		<input type="checkbox" id="books" name="interest" value="books"><label for="books">Books</label>
		<input type="checkbox" id="movies" name="interest" value="movies"><label for="movies">Movies</label>
		<input type="checkbox" id="games" name="interest" value="games"><label for="games">Games</label><br><br>
		<label for="color">Select your favourite color</label>
		<input type="color" id="color" name="favouritecolor">
	</fieldset>
	<button type="submit">Send Data</button>
	<button type="reset">Reset Form</button>
</form>
</form>
