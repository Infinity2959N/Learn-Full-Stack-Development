<html>
	<head>
		<title>CSS</title>
		<style>
			/* Q6 */
			body{
				background-image: url("C:/Users/HP/Pictures/sample/shapes.png");
				background-attachment: fixed;	/* Anchor to the viewport*/
				background-size: cover;		/* Ensures covers the whole page */
				background-repeat: no-repeat;
			}

			/* Q7 */
			header{
				background-image: url("C:/Users/HP/Pictures/sample/shapes.png");
				border-radius: 10%;
				text-align: center;
				background-position: top center;	/* moves it to top middle */
				background-repeat: repeat-x;	/* Tiles it horizontally only */
				height: 100px;
			}
		<style>
	</head>
<body>
	<header> This is a header</header>
</body>
