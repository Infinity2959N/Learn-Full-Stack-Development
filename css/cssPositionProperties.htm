<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        /* Position of element */
        .pos{
            /* Positions explained:
            static: Default position, elements are positioned according to the normal flow of the document.
            relative: The element is positioned relative to its normal position. You can use top, right, bottom, and left properties to adjust its position.
            absolute: The element is positioned relative to its nearest positioned ancestor (not static). If there is no such ancestor, it will be positioned relative to the initial containing block (usually the viewport).
            fixed: The element is positioned relative to the viewport, which means it stays in the same place even if the page is scrolled.
            sticky: The element is treated as relative until it crosses a specified threshold, at which point it becomes fixed. This is often used for headers that stick to the top of the page when scrolling.
            */
            position: sticky; 
            top: 100px;
            left: 100px;
            /*bottom: 50px;*/
            /*right: 70px;*/
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Hemlo</h1>
    <h1>Hemlo</h1>

</html>
