<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate details</title>
</head>
<body>
    <!--Validate name, email, phone number and password-->
    <form method="post" onsubmit="return validateForm()">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="text" id="email" name="email"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <input type="submit" value="Submit">
    </form>

    <script>
        function validateForm(){
            let name= getElementById("name").value;
            let mail= getElementById("email").value;
            let phone= getElementById("phone").value;
            let password= getElementById("password").value;

            let nameRegex= /^[A-Z][a-z]+( [A-Z][a-z]+)*$/;
            let mailRegex= /^[a-zA-Z0-9_%-+.#]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/;
            let phoneRegex= /^"+"?[0-9]{2,3}?[0-9]{10}$/;
            let passwordRegex= /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%?&]).{8,}$/;

            if(!nameRegex.test(name)){
                alert("Name must contain alphabets and spaces. First letter should be capital");
                return false;
            }
            if(!mailRegex.test(mail)){
                alert("Incorrect email");
                return false;
            }
            if(!phoneRegex.test(phone)){
                alert("Invalid Phone number. Must be atleast 10 digits");
                return false;
            }
            if(!passwordRegex.test(password)){
                alert("Password must contain atleast one uppercase, one lowercase, one digit and one symbol. Minimum password length=8");
                return false;
            }

            return true;
        }
    </script>
    
</body>
</html>
